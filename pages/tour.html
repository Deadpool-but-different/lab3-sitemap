<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тур — Байкал Тур</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #263238;
            background: #f4f6f5;
        }

        header {
            background: #1d4545;
            color: white;
            padding: 20px 60px;
        }

        header h1 {
            display: inline;
            margin-right: 50px;
        }

        nav {
            display: inline;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .tour {
            width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
        }

        .tour img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .tour h2 {
            font-size: 32px;
        }

        .price {
            font-size: 24px;
            color: #1d4545;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            background: #1d4545;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        footer {
            background: #1d4545;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Байкал Тур</h1>

        <nav>
            <a href="../index.html">Главная</a>
            <a href="./catalog.html">Туры</a>
            <a href="./about.html">О нас</a>
        </nav>
    </header>

    <main>
        <section class="tour" id="tour">
            <p>Загрузка тура...</p>
        </section>
    </main>

    <footer>
        <p>Байкал Тур © 2026</p>
        <p>Телефон: +7 (900) 123-45-67</p>
        <p>Email: info@baikal-tour.ru</p>
    </footer>

            1: {

                duration: "3 дня",

                description: "Пеший маршрут по живописным горным тропам. Вас ждут панорамные виды, чистый воздух и знакомство с природой горного Байкала.",
                program: "Первый день — знакомство с группой и начало маршрута. Второй день — прогулка по горным тропам и отдых на природе. Третий день — возвращение."
            },

            2: {
                name: "Озёра Байкала",
                image: "../img/pic2.jpg",
                duration: "2 дня",
                price: "9 000 ₽",
                description: "Путешествие к живописным озёрам Байкальского региона с остановками для отдыха и фотографий.",
                program: "Первый день — дорога к озёрам и прогулка по окрестностям. Второй день — исследование побережья и возвращение."
            },

            3: {
                name: "Тропами тайги",
                image: "../img/pic3.jpg",
                duration: "2 дня",
                price: "7 000 ₽",
                description: "Пеший поход по хвойным лесам и природным тропам вдали от городской суеты.",
                program: "Первый день — знакомство с маршрутом и поход по лесу. Второй день — прогулка по окрестностям и возвращение."
            },

            4: {
                name: "Горные долины",
                image: "../img/pic4.jpg",
                duration: "4 дня",
                price: "18 000 ₽",
                description: "Многодневное путешествие по горным долинам с панорамными видами и остановками в красивых природных местах.",
                program: "Первый день — начало маршрута. Второй и третий дни — исследование долин. Четвёртый день — возвращение."
            },

            5: {
                name: "Байкал с высоты",
                image: "../img/pic5.jpg",

                price: "14 000 ₽",

                program: "Встреча группы, инструктаж, прогулка по лесным тропам, отдых и возвращение."
            },

            8: {
                name: "Дорога к водопадам",
                image: "../img/pic8.jpg",
                duration: "2 дня",
                price: "8 500 ₽",
                description: "Пеший маршрут к природным водопадам среди лесов и горных склонов.",
                program: "Первый день — начало похода и остановка на отдых. Второй день — посещение водопадов и возвращение."
            },

            9: {
                name: "Большое путешествие",
                image: "../img/pic9.jpg",
                duration: "5 дней",
                price: "25 000 ₽",
                description: "Продолжительный тур для знакомства с разнообразными ландшафтами горного Байкала.",
                program: "Первый день — прибытие. Второй и третий дни — основные маршруты. Четвёртый день — отдых и прогулки. Пятый день — возвращение."
            },

            10: {
                name: "Тихая тайга",
                image: "../img/pic10.jpg",
                duration: "1 день",
                price: "3 500 ₽",

                program: "Встреча группы, прогулка по лесу, остановка на отдых и возвращение к месту отправления."
            },

                image: "../img/pic11.jpg",
                duration: "2 дня",

                program: "Первый день — прибытие и подготовка. Второй день — ранний выход, встреча рассвета и возвращение."
            },

            12: {
                name: "Долина приключений",
                image: "../img/pic12.jpg",
                duration: "3 дня",
                price: "13 000 ₽",
                description: "Активное путешествие по природным маршрутам с прогулками и остановками в живописных местах.",
                program: "Первый день — начало маршрута. Второй день — исследование долины. Третий день — заключительная прогулка и возвращение."
            },

            13: {
                name: "Берега Байкала",
                image: "../img/pic13.jpg",
                duration: "2 дня",
                price: "9 500 ₽",
                description: "Путешествие вдоль берегов Байкала с прогулками, отдыхом и знакомством с местными пейзажами.",
                program: "Первый день — прогулка по побережью. Второй день — исследование окрестностей и возвращение."
            },

            14: {
                name: "Выходные в горах",
                image: "../img/pic14.jpg",
                duration: "2 дня",
                price: "10 000 ₽",
                description: "Короткий тур для тех, кто хочет провести выходные в горах и отдохнуть от городской жизни.",

            },

            15: {
                name: "Золотая осень",
                image: "../img/pic15.jpg",
                duration: "3 дня",
                price: "15 000 ₽",
                description: "Сезонное путешествие по лесам и горам, особенно красивым в период осенних красок.",

            }
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const tour = tours[id];
        const container = document.getElementById("tour");

        if (tour) {
            document.title = tour.name + " — Байкал Тур";

            container.innerHTML = `
                <img src="${tour.image}" alt="${tour.name}">

                <h2>${tour.name}</h2>

                <p>${tour.description}</p>

                <p><b>Продолжительность:</b> ${tour.duration}</p>

                <p class="price">Стоимость: ${tour.price}</p>

                <h3>Программа тура</h3>
                <p>${tour.program}</p>

                <a href="./booking.html?id=${id}" class="button">
                    Забронировать тур
                </a>

                <a href="./catalog.html" class="button">
                    Вернуться в каталог
                </a>
            `;
        } else {
            container.innerHTML = `
                <h2>Тур не найден</h2>
                <p>Такого тура нет в каталоге или ссылка указана неверно.</p>
                <a href="./catalog.html" class="button">
                    Вернуться в каталог
                </a>
            `;
        }
    </script>

</body>
</html>
